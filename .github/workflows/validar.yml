name: Validar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Metadatos, enlaces e imágenes
        run: python3 scripts/validar.py
      - name: Grafo (relaciones entre documentos)
        run: python3 metodo/grafo/grafo.py --check
      - name: Lo que se genera desde los metadatos (páginas, llms.txt, catalogo.json)
        run: python3 scripts/generar.py --check
