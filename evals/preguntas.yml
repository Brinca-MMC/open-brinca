# Prueba de Open Brinca: 36 preguntas que un gerente o consultor le haría a su asistente
# teniendo solo este repositorio, con la clave para corregirlas. Cómo se usa: evals/README.md.
# Campos: id, tipo, idioma (es | en), dificultad (baja | media | alta), pregunta,
# respuesta_esperada, fuentes (rutas relativas a la raíz y marca), aprueba_si y falla_si.
# Reparto: cifra 8 · quien 7 · sintesis 9 · tension 6 · uso 3 · trampa 3 (dos en inglés).

# ───────────── CIFRAS ─────────────

- id: P01
  tipo: cifra
  idioma: es
  dificultad: baja
  pregunta: "¿Qué porcentaje de las empresas le está sacando provecho de verdad a la IA? Me dijeron que es muy bajo."
  respuesta_esperada: "Según el informe de adopción de IA 2026 de Wharton y GBK Collective, presentado en el webinar del 20 de octubre de 2026, solo el 7 % de los managers+ cumple a la vez los tres marcadores de éxito: ROI fuertemente positivo (28 %), flujos de trabajo transformados (20 % de los departamentos) y organización alineada (39 %). El uso ya es casi universal: el 62 % la usa a diario. Es una encuesta autorreportada a unas 1.400 personas de grandes empresas de EE. UU."
  fuentes:
    - ruta: webinars/2026-10-20-wharton-adaptive-advantage/README.md
      marca: "[10:16]"
    - ruta: webinars/2026-10-20-wharton-adaptive-advantage/README.md
      marca: "[04:46]"
  aprueba_si: "da 7 %, lo atribuye al informe Wharton-GBK 2026 (o al webinar de Wharton), explica que es cumplir los tres marcadores a la vez y no lo presenta como un dato de Chile."
  falla_si: "da el 28 % (solo ROI) o el 62 % (uso diario) como respuesta; lo presenta como cifra chilena o mundial sin decir que la muestra es de grandes empresas de EE. UU.; o inventa una cifra de otra fuente."

- id: P02
  tipo: cifra
  idioma: es
  dificultad: alta
  pregunta: "Leí que casi el 60 % de las empresas con buen retorno de IA tiene un Chief AI Officer. ¿Es así? Lo quiero usar para justificar el cargo."
  respuesta_esperada: "No: Jeremy Korst lo dijo al revés en el webinar de Wharton, y la transcripción lo corrige en una nota. El dato del informe es que el 58 % de los managers+ de organizaciones con un CAIO recién designado reporta ROI fuertemente positivo, contra el 24 % donde el rol se sumó a un cargo existente y el 8 % sin CAIO. Es correlación y autorreporte, y Korst agrega que el CAIO no debe ser el único líder de IA."
  fuentes:
    - ruta: webinars/2026-10-20-wharton-adaptive-advantage/README.md
      marca: "[16:12]"
    - ruta: webinars/2026-10-20-wharton-adaptive-advantage/transcripcion.md
      marca: "[15:22] y nota [^1]"
  aprueba_si: "corrige la dirección del dato (el 58 % de quienes tienen un CAIO nuevo reporta ROI fuerte, no el 58 % de los de ROI fuerte tiene CAIO), menciona que Korst lo dijo al revés o la nota de la transcripción y lo atribuye al informe Wharton-GBK 2026."
  falla_si: "confirma que casi el 60 % de las empresas con buen ROI tiene un CAIO, tal como lo dijo Korst («nearly 60% reported to have a CAIO»); o presenta la relación como causal."

- id: P03
  tipo: cifra
  idioma: es
  dificultad: alta
  pregunta: "En el panel de la Ley I+D dijeron que un proyecto de 100 millones te sale en 75 con la ley. ¿Ese es el ahorro real?"
  respuesta_esperada: "Lo dijo Juviska Meza (Brinca) para mostrar cómo usar la ley como argumento de venta, pero la nota 3 de la transcripción aclara que es un ejemplo ilustrativo y no un cálculo. Con la ley vigente, 100 millones invertidos dan un crédito del 35 % contra el impuesto de primera categoría (tope anual de 15.000 UTM), así que el costo neto queda en 65 millones; como el 65 % restante se rebaja además como gasto, con un impuesto de 27 % queda en unos 47 millones. Los 75 millones no salen de ese cálculo."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia2-08-panel-ley-i-d-oportunidades-ia/README.md
      marca: "[27:05]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia2-08-panel-ley-i-d-oportunidades-ia/transcripcion.md
      marca: "[27:01] y nota [^3]"
  aprueba_si: "dice que los 75 millones son un ejemplo ilustrativo de Meza y da el cálculo de la nota: crédito del 35 % (costo neto de 65 millones) y unos 47 millones al sumar la rebaja como gasto. Puede sugerir confirmarlo con un asesor tributario."
  falla_si: "confirma los 75 millones (un 25 % de ahorro) como el beneficio de la ley, que es lo que dice la ficha sin la nota; o inventa otro porcentaje."

