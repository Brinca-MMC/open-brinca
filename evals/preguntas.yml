  tipo: cifra
  idioma: es
  dificultad: baja
  pregunta: "En el panel del futuro del trabajo hablaron de cuántas tecnologías de frontera lidera China. ¿Cuántas eran?"
  respuesta_esperada: "Denisse Goldfarb (The People Future) dijo 69, pero la cifra correcta, según el Critical Technology Tracker del ASPI (actualización de 2025), es 66 de 74; Estados Unidos lidera las otras 8, entre ellas la computación cuántica. Lo usó para hablar de los robots humanoides que China impulsa por su problema demográfico."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-06-panel-futuro-trabajo-ia-impacto-personas-gestion-cambio/README.md
