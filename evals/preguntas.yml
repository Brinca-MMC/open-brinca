- id: P30
  tipo: tension
  idioma: es
  dificultad: alta
  pregunta: "¿Va a haber desempleo masivo por la IA? Dame las distintas posturas que hubo en el evento."
  respuesta_esperada: "No hay una conclusión común. Escépticos del desempleo masivo: Puntoni (no ve el apocalipsis a la escala de Silicon Valley), Paula Aguirre (solo cerca del 18 % de los empleos está en riesgo muy alto de automatización), Denisse Goldfarb (potencial no es realidad; no cree que se pierda el 50 % de los cargos de entrada), Alberto Mayol (lo normal es que «no pase nada») y Francisco Martínez (el apocalipsis que importa es un trabajo más precario por mala adopción). Más alarmados o con otro ángulo: Fernando Hentzschel (la destrucción de empleo puede venir de que las pymes no adopten), George Lever (la IA primero destruye, luego sostiene y después crea empleo), Edmundo Casas (los humanoides «van a reemplazarnos físicamente»), Kenneth Pugh (el empleo se pierde ante quien sabe usar IA), José Rafael Correa (el riesgo está en el grupo de 30 a 50 años) y Álvaro Fischer (hay que adaptarse en vez de pelear contra el desempleo). Goldfarb citó además predicciones de terceros: Yampolskiy, 99 % de desempleo hacia 2030."
  fuentes:
