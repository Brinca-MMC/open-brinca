# ───────────── TENSIONES ─────────────

- id: P25
  tipo: tension
  idioma: es
  dificultad: media
  pregunta: "¿Están de acuerdo en si Chile tiene que regular la IA ya o esperar?"
  respuesta_esperada: "Coinciden en regular el uso o el despliegue y no la tecnología, pero no en el tono ni en el momento. En el panel público-privado (dia1-02), Catherine Muñoz dice que la IA ya está regulada por normas sectoriales, que la sobrerregulación es una brecha en sí misma y que hace falta una ley habilitante con sandbox; George Lever cuenta que el proyecto de ley estuvo a punto de ser «un error garrafal», apuesta por la autorregulación (el código de la CCS) y quiere que Chile lidere la IA, no que la regule. En el panel de regulación (dia2-03), José Rafael Correa cree que «vamos a terminar regulando» y que conviene hacerlo pronto, con una ley marco de principios, para no legislar en la contingencia de una tragedia; Kenneth Pugh pide una agravante penal y sandbox con certificación, y recuerda que el art. 8 bis ya exige explicar las decisiones automatizadas."
  fuentes:
