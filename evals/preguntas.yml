    - ruta: eventos/impacta-ia-2026/sesiones/dia1-06-panel-futuro-trabajo-ia-impacto-personas-gestion-cambio/transcripcion.md
      marca: "[26:57] y nota [^2]"
  aprueba_si: "da 66 de 74, con el ASPI como fuente o mencionando la corrección, y nombra a Goldfarb."
  falla_si: "da 69 sin corrección, o una cifra distinta de 66."

- id: P05
  tipo: cifra
  idioma: es
  dificultad: media
  pregunta: "Necesito un número para convencer al directorio de que la IA no es solo para recortar costos. ¿Qué cálculo mostró Puntoni?"
  respuesta_esperada: "En su keynote de Impacta, Stefano Puntoni (Wharton) usa un modelo simple de valoración. Si la IA baja un 10 % la mitad de los costos, un supuesto que él llama generoso, el valor de la firma sube un 10 % en tres años. Si en cambio sube el crecimiento orgánico de 3 % a 5 %, el valor sube un 50 %. Si combina ambas cosas y el crecimiento llega a 7 %, el valor se más que duplica (la lámina dice +122 %). Su frase: «You can drive cost only down to zero»."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-05-keynote-against-productivity-reaping-rewards-ai-revolution/README.md
      marca: "[07:54]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-05-keynote-against-productivity-reaping-rewards-ai-revolution/README.md
      marca: "[09:38]"
  aprueba_si: "da los escenarios (+10 % de valor por recortar costos, +50 % por dos puntos más de crecimiento, más del doble con 7 %), los atribuye a Puntoni en Impacta y aclara que son supuestos de un modelo ilustrativo."
  falla_si: "inventa cifras, confunde el 10 % de recorte de costos con el 10 % de aumento de valor, o presenta el modelo como evidencia empírica."

- id: P06
  tipo: cifra
  idioma: es
  dificultad: media
  pregunta: "¿Cuánta plata podría traer a Chile convertirse en un hub de data centers? Me acuerdo de que dieron un número grande."
  respuesta_esperada: "Ignacio Briones, en el panel de data centers, cita a McKinsey: entre 2026 y 2030 la inversión mundial sería de 7,9 trillones de dólares (en escala estadounidense), algo más de 5 de ellos en infraestructura de megadata centers. Si Chile capturara apenas el 1 %, serían unos 10 mil millones de dólares de inversión al año, «más que toda la minería». Él mismo advierte que el empleo directo será poco y los impuestos difíciles de cobrar; lo valioso es reservar capacidad de cómputo para el país."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia2-05-panel-datacenters-ia-oportunidad-chile/README.md
      marca: "[12:27]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia2-05-panel-datacenters-ia-oportunidad-chile/transcripcion.md
      marca: "[11:50] y nota [^1]"
  aprueba_si: "da unos 10 mil millones de dólares al año como el 1 % de la inversión mundial y lo atribuye a Briones, con la estimación de McKinsey."
  falla_si: "da los 7 o 7,9 trillones como lo que llegaría a Chile; cambia el orden de magnitud al traducir trillones (por ejemplo, «5 mil millones de millones», que la nota corrige); o lo atribuye a otro panelista."

- id: P07
  tipo: cifra
  idioma: es
  dificultad: baja
  pregunta: "¿Qué porcentaje de las empresas chilenas está logrando escalar la IA, más allá de probarla?"
  respuesta_esperada: "El 9 %, según el Índice de IA 2026 (ITD-IA) de CORFO, la Cámara de Comercio de Santiago y la consultora PMG Chile, que citó la moderadora Carolina Garlick (Diario Financiero) al abrir el panel público-privado. El mismo índice pone a Chile a la cabeza de Latinoamérica, pero en el sector industrial el país cae del primer lugar al duodécimo."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-02-panel-encuentro-publico-privado-adopcion-sin-brechas/README.md
      marca: "[02:31]"
  aprueba_si: "da 9 %, lo atribuye al índice de CORFO y la CCS que citó Garlick (la consultora es PMG Chile; no se penaliza que diga KPMG si así lo trae el repositorio que leyó) y no lo mezcla con cifras de EE. UU."
  falla_si: "da cifras del estudio de Wharton (7 %, 28 %, 62 %) como si fueran de Chile, o inventa otra."

- id: P08
  tipo: cifra
  idioma: es
  dificultad: alta
  pregunta: "El de Kauel dio un ejemplo de ROI con el litio de SQM. ¿De cuánto era y es confiable?"
  respuesta_esperada: "Edmundo Casas (Kauel) calculó que si el error al estimar el litio bajo el agua de los salares baja del 20 % al 1 %, un productor como Soquimich podría aumentar su facturación en torno a un 19 % (multiplicó 1.500 millones de dólares por 1,19). Es su propia cuenta, no un caso medido, y la base está mal: la nota 4 de la transcripción aclara que SQM informó ingresos 2025 por 4.576 millones de dólares en total y 2.288 millones en litio, no 1.500."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-04-charla-roi-real-ia-impacto-rentabilidad-negocio/README.md
      marca: "[28:15]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-04-charla-roi-real-ia-impacto-rentabilidad-negocio/transcripcion.md
      marca: "[27:29] y nota [^4]"
  aprueba_si: "da el ~19 % como estimación de Casas y advierte que la base de 1.500 millones no calza con lo que informó SQM (nota 4) o que es una cuenta ilustrativa no verificada."
  falla_si: "presenta el 19 % o los 1.500 millones como datos verificados de SQM, o calcula un monto en dólares a partir de los 1.500 millones sin advertencia."

# ───────────── QUIÉN DIJO QUÉ ─────────────

- id: P09
  tipo: quien
  idioma: es
  dificultad: baja
  pregunta: "¿Quién habló de «lo dijo el algoritmo» en el panel de gobernanza, y qué proponía?"
  respuesta_esperada: "Macarena MacKay (Alumni UC y Asociación de Ética Empresarial y Organizacional), en el panel de Gobernanza Corporativa de la IA. La frase se volvió el punto final de una discusión que no se da y diluye la responsabilidad: ya no hay responsables con nombre y apellido. Propone responder no solo por lo que se decide sino por cómo se llegó a la decisión, y una cultura que dé condiciones para detener un proceso («supervisión humana no es lo mismo que presencia humana»). Felipe Morales (Walmart Chile) lo retoma: «me lo dijo el algoritmo» es inaceptable."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-03-panel-gobernanza-corporativa-ia/README.md
      marca: "[25:24]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-03-panel-gobernanza-corporativa-ia/README.md
      marca: "[26:41]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-03-panel-gobernanza-corporativa-ia/README.md
      marca: "[48:43]"
  aprueba_si: "nombra a Macarena MacKay y su idea central (responsables con nombre y apellido, o responder por cómo se decide). Mencionar a Felipe Morales suma."
  falla_si: "lo atribuye a otro panelista (Claudia Ramos, Nicolás Rivas o el moderador) o inventa la propuesta."

- id: P10
  tipo: quien
  idioma: es
  dificultad: media
  pregunta: "¿Puntoni cree que la IA va a dejar a mucha gente sin trabajo?"
  respuesta_esperada: "No al ritmo que se anuncia. En las preguntas de su keynote en Impacta dice que no ve el «apocalipsis del empleo» a la escala y velocidad que dice Silicon Valley, que tiene un conflicto de interés porque cuenta esas historias para subir su valorización. Sí espera fricción y reasignación del trabajo («I don't think that everybody can thrive in the world of AI») y pone la clave en la complementariedad entre personas e IA. Su preocupación es otra: que un discurso de solo eficiencia se oiga como despidos («Leaders say efficiency, workers hear layoffs»)."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-05-keynote-against-productivity-reaping-rewards-ai-revolution/README.md
      marca: "[40:52]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-05-keynote-against-productivity-reaping-rewards-ai-revolution/README.md
      marca: "[39:22]"
  aprueba_si: "dice que Puntoni es escéptico del apocalipsis del empleo, menciona el conflicto de interés de Silicon Valley y que sí espera fricción o reasignación."
  falla_si: "dice que Puntoni predice desempleo masivo, o le atribuye las predicciones de Yampolskiy o Amodei que citó Goldfarb en otro panel."

- id: P11
  tipo: quien
  idioma: es
  dificultad: baja
  pregunta: "¿Qué es eso de la «deuda de desarrollo» que mencionó el profesor de Duke?"
  respuesta_esperada: "Es de Daniel Strode (Duke Corporate Education, ex Banco Santander), en su keynote: la brecha entre lo que la IA te ahorra en el corto plazo y lo que va agotando en silencio en el largo plazo. Su ejemplo es Klarna, que reemplazó a 700 personas de servicio al cliente por un chatbot y después admitió que la calidad bajó (la ficha advierte que las cifras del relato no se pudieron verificar). El riesgo es formar gente frágil; los remedios son zonas de formación sin IA, protocolos de «muestra tu razonamiento», tareas desafiantes antes de estar listo y reflexión después de cada decisión tomada con IA."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-07-keynote-quiet-reckoning-leaders-what-remains-when-ai-peels-back-rest/README.md
      marca: "[23:18]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-07-keynote-quiet-reckoning-leaders-what-remains-when-ai-peels-back-rest/README.md
      marca: "[24:33]"
  aprueba_si: "atribuye el concepto a Daniel Strode, da la definición (ahorro de corto plazo contra lo que se agota en el largo) y al menos dos de los cuatro remedios."
  falla_si: "lo atribuye a otro speaker, lo confunde con la deuda técnica del software, o inventa los remedios."

- id: P12
  tipo: quien
  idioma: es
  dificultad: baja
  pregunta: "¿Qué dijo el exsenador Pugh sobre la responsabilidad de los directorios con la IA?"
  respuesta_esperada: "Kenneth Pugh, en el panel de regulación: «Los directorios pueden tercerizar tecnología todo lo que quieran, pero no pueden tercerizar la responsabilidad». Agrega que quien no use IA va a desaparecer y quien la use mal será sancionado, propone una agravante penal para los delitos cometidos con IA y recuerda que el artículo 8 bis de la Ley de Protección de Datos Personales, el «artículo Condorito: exijo una explicación», ya obliga a explicar en lenguaje humano las decisiones automatizadas."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia2-03-panel-desafios-tensiones-regulacion-ia/README.md
      marca: "[46:03]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia2-03-panel-desafios-tensiones-regulacion-ia/README.md
      marca: "[50:22]"
  aprueba_si: "da la idea de que la responsabilidad no se terceriza y la atribuye a Pugh en el panel de regulación. Mencionar el art. 8 bis suma."
  falla_si: "la atribuye a José Rafael Correa o a Pedro Huichalaf, o inventa obligaciones legales que no se dijeron."

- id: P13
  tipo: quien
  idioma: es
  dificultad: media
  pregunta: "¿Qué hizo CMPC con IA en sus plantas? Me lo contaron como un ejemplo de algo que sí funcionó."
  respuesta_esperada: "Matías Jory (CMPC), en el panel de IA industrial, metió un agente dentro de Carta Farol, la herramienta donde el operador ya llenaba el SCA (síntoma, causa, acción) cuando una variable crítica se sale de rango. El llenado era del 95 %, pero de baja calidad. Ahora el agente revisa el estándar operacional contra los datos del proceso, las bitácoras y los informes de turno, propone la causa más probable y las acciones, el operador valida o registra otra causa y el sistema aprende. «No agregamos una pantalla nueva, no creamos una rutina nueva»: la IA que funciona vive en la rutina del operador, sobre un sistema de gestión."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia2-04-panel-ia-industrial-gemelos-digitales-logistica/README.md
      marca: "[15:41]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia2-04-panel-ia-industrial-gemelos-digitales-logistica/README.md
      marca: "[17:49]"
  aprueba_si: "nombra a Matías Jory, describe el agente dentro del SCA o de Carta Farol y la idea de no crear pantallas ni rutinas nuevas."
  falla_si: "lo confunde con los casos de Antofagasta Minerals (ADA, el desgaste de los molinos) o inventa cifras de ahorro."

- id: P14
  tipo: quien
  idioma: es
  dificultad: media
  pregunta: "¿Qué decía Bergoeing sobre la desigualdad que trae la IA? ¿Se abre la brecha entre personas?"
  respuesta_esperada: "Raphael Bergoeing (UAI), en el panel Sociedad del futuro, dice que los datos no muestran que crezca la brecha entre personas sino entre organizaciones: se separan las que se gobiernan bien y cambian sus procesos, y las personas se separan según en qué organización estén. «Se juega mucho más en cambiar la organización que en cambiar a una persona». Cree que la IA puede subir a los de abajo, con su ejemplo de los ayudantes de investigación que hoy tiene gratis, salvo que se la lleven unos pocos y la política no resuelva la capacitación: al final es una decisión de política."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-08-panel-sociedad-futuro-escasez-abundancia/README.md
      marca: "[16:24]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-08-panel-sociedad-futuro-escasez-abundancia/README.md
      marca: "[19:21]"
  aprueba_si: "da la idea de que la brecha crece entre organizaciones y no entre personas, atribuida a Bergoeing."
  falla_si: "dice que Bergoeing predice más desigualdad entre personas, o atribuye la idea a Mayol o a Pérsico."

- id: P15
