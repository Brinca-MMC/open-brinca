# ───────────── SÍNTESIS ─────────────

- id: P16
  tipo: sintesis
  idioma: es
  dificultad: alta
  pregunta: "Tengo que armar la gobernanza de IA de mi empresa. ¿Qué se dijo que me sirva?"
  respuesta_esperada: "La idea común es que la IA no se puede gobernar como la informática tradicional, con permiso previo y comité. En el panel de gobernanza (dia1-03): registrar y gobernar a posteriori, poner la atención en lo irreversible, usar la propia IA para revisar el cumplimiento y hacer responsable a quien construye (Rivas); gobernar por etapas, del registro a la prueba de concepto, al humano en el loop y a la autonomía supervisada ex post, con cuatro preguntas antes de escalar: valor, riesgo, impacto en personas y responsable (Felipe Morales); una mesa diversa que sesiona cada dos semanas y un índice que puntúa cada caso (Ramos, Bci); responsables con nombre y apellido (MacKay). En el de regulación (dia2-03): cinco preguntas al C-level, entre ellas con qué datos, con qué contratos y cuánto se tarda en apagar el sistema (Correa), y la responsabilidad no se terceriza (Pugh). En vibe coding (dia2-02): libertad para crear y control del «por dónde» (Araya); centralizar accesos, gobierno y FinOps (Izurieta)."
  fuentes:
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-03-panel-gobernanza-corporativa-ia/README.md
      marca: "[18:25]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-03-panel-gobernanza-corporativa-ia/README.md
      marca: "[34:36]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia1-03-panel-gobernanza-corporativa-ia/README.md
      marca: "[49:46]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia2-03-panel-desafios-tensiones-regulacion-ia/README.md
      marca: "[44:33]"
    - ruta: eventos/impacta-ia-2026/sesiones/dia2-02-panel-revolucion-vibe-coding-interior-empresas-nuevos-paradigmas/README.md
      marca: "[29:12]"
  aprueba_si: "cruza al menos dos sesiones (por ejemplo dia1-03 y dia2-03) y da al menos tres prácticas concretas, cada una con su speaker."
  falla_si: "da recomendaciones genéricas (comité de ética, políticas, marcos tipo NIST o ISO) sin anclarlas a lo que se dijo, o se queda en una sola sesión."

- id: P17
  tipo: sintesis
  idioma: es
