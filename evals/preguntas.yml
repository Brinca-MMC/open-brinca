# ───────────── USO, LICENCIA Y MÉTODO ─────────────

- id: P31
  tipo: uso
  idioma: es
  dificultad: baja
  pregunta: "¿Puedo usar el contenido de Open Brinca en una propuesta comercial para un cliente? ¿Y copiar pedazos de las transcripciones?"
  respuesta_esperada: "Depende de qué parte. Lo que escribe Brinca (fichas, índices, glosarios, el método) está bajo CC BY 4.0: se puede usar y adaptar, también con fines comerciales, citando «Open Brinca, de Brinca» con un enlace al repositorio. Las transcripciones están bajo CC BY-NC-ND 4.0: solo sin fines comerciales y sin modificar; aun así, citar fragmentos con su fuente (quién habló, la sesión y la marca de tiempo) entra en el derecho de cita. Las láminas son de sus autores, con todos los derechos reservados: no se licencian. El código está bajo MIT."
  fuentes:
    - ruta: LICENSE.md
      marca: "tabla de licencias"
    - ruta: README.md
      marca: "sección «Licencias»"
  aprueba_si: "distingue las fichas (CC BY 4.0, uso comercial con atribución) de las transcripciones (CC BY-NC-ND 4.0, sin uso comercial ni modificación, salvo el derecho de cita) y dice que las láminas no están licenciadas."
  falla_si: "dice que todo es CC BY o de libre uso, o que nada se puede usar comercialmente."

- id: P32
  tipo: uso
  idioma: es
  dificultad: media
  pregunta: "Voy a poner en un informe para el directorio una frase de Puntoni y un dato del webinar de Wharton. ¿Cómo lo cito bien?"
  respuesta_esperada: "Nombrar a quien habló, la sesión y la marca [mm:ss], y enlazar la página de la sesión en open.brinca.com o el segundo exacto del video: las marcas de Impacta ya son enlaces a YouTube; el webinar de Wharton no tiene video público, así que sus marcas no llevan enlace. Para una cita textual, usar transcripcion.md (la keynote de Puntoni está en inglés). Si la cifra tiene una nota [^n], citar el dato corregido y no el dicho. Mencionar la fuente como «Open Brinca, de Brinca» con el enlace; la cita formal es: Open Brinca. Brinca, 2026. https://open.brinca.com, y CITATION.cff la trae en formato de máquina."
  fuentes:
    - ruta: AGENTS.md
      marca: "sección «Cómo citar»"
    - ruta: LICENSE.md
      marca: "sección «Cómo citar»"
    - ruta: webinars/2026-10-20-wharton-adaptive-advantage/transcripcion.md
      marca: "encabezado (sin video público)"
  aprueba_si: "incluye quién habló, la sesión y la marca de tiempo; usar la transcripción para citas textuales; la regla de citar el dato corregido de las notas; y la referencia a Open Brinca con su enlace (open.brinca.com; también vale el repositorio en GitHub)."
  falla_si: "propone un formato sin marca de tiempo, omite la regla de las notas, o da un enlace que no es de Open Brinca."

- id: P33
  tipo: uso
  idioma: es
  dificultad: baja
  pregunta: "¿Cómo se hicieron estas transcripciones? ¿Las hizo una IA? ¿Me puedo fiar?"
  respuesta_esperada: "Con IA y revisión. Cada clip pasó por Whisper large-v3 (en Impacta, con 91 % a 97 % de coincidencia con los subtítulos del stream); las voces se separaron con SpeechBrain ECAPA y se nombraron mirando los fotogramas (en el webinar, el recuadro de Zoom); las láminas se leyeron plano por plano; y un agente de IA revisó cada sesión en tres pasadas: lo que Whisper escuchó mal, lo que quedó en otro idioma y lo que el speaker dijo mal. Un verificador independiente, con otro modelo, revisó las correcciones, las citas y las imágenes, y Brinca revisó las dudas. Pueden tener errores menores: ante una cita importante conviene contrastarla con el video en esa marca; las cifras corregidas en notas ya se contrastaron con su fuente."
  fuentes:
    - ruta: metodo/transcripcion/README.md
      marca: "secciones «Los pasos» y «Cuánto confiar»"
    - ruta: eventos/impacta-ia-2026/README.md
      marca: "sección «Cómo se hizo»"
  aprueba_si: "menciona Whisper, la revisión en tres pasadas por un agente de IA, el verificador independiente y la revisión de Brinca, y la advertencia de contrastar las citas importantes con el video."
  falla_si: "dice que las transcribió una persona a mano, que son exactas y sin errores, o inventa herramientas o pasos."

